<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Meeting</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f0f0f0;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #f0f0f0;
        }
        .btn {
            background-color: #ff4081;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #f50057;
        }
        .link {
            color: #00bcd4;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join a Meeting</h1>
        <form action="{{ url_for('join') }}" method="POST">
            <div>
                <label for="roomID">Enter Meeting ID:</label>
                <input type="text" name="roomID" class="input-field" required><br><br>
            </div>
            <input type="submit" class="btn" value="Join">
        </form>
        <a href="{{ url_for('dashboard') }}" class="link">Back to Dashboard</a>
    </div>
</body>
</html>
